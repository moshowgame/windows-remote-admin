<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件资源管理器</title>
    <link href="/static/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/static/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/bootstrap/5.3.2/css/bootstrap-icons.min.css">
    <style>
        /* 马里奥像素风格主题 */
        :root {
            --mario-red: #e52521;
            --mario-blue: #3c44aa;
            --mario-green: #4bad4b;
            --mario-yellow: #fbd000;
            --mario-brown: #964b00;
            --mario-skin: #fcb97d;
            --pixel-bg: #6b8cff;
            --pixel-border: #000000;
            --pixel-highlight: #ff0000;
            --pixel-text: #ffffff;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            padding: 20px 0;
            overflow-x: hidden;
        }

        /* 装饰性背景元素 */
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .mario-block {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--mario-red);
            border: 4px solid var(--pixel-border);
            z-index: 1;
        }

        .mario-block.question {
            background: var(--mario-yellow);
            color: var(--pixel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
        }

        .coin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--mario-yellow);
            border: 2px solid var(--pixel-border);
            border-radius: 50%;
            animation: coinFloat 3s ease-in-out infinite;
        }

        @keyframes coinFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .pipe {
            position: absolute;
            width: 60px;
            background: var(--mario-green);
            border: 4px solid var(--pixel-border);
        }

        .pipe-top {
            height: 30px;
            border-bottom: none;
            border-radius: 30px 30px 0 0;
        }

        .pipe-stem {
            height: 80px;
            border-top: none;
        }

        .cloud {
            position: absolute;
            background: white;
            border: 3px solid var(--pixel-border);
            border-radius: 50%;
        }

        .cloud:before, .cloud:after {
            content: "";
            position: absolute;
            background: white;
            border: 3px solid var(--pixel-border);
            border-radius: 50%;
        }

        /* 主文件管理器容器 */
        .file-explorer {
            background: var(--pixel-bg);
            border: 6px solid var(--pixel-border);
            box-shadow: 12px 12px 0px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            height: 80vh;
            position: relative;
        }

        .file-explorer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--pixel-highlight),
                var(--pixel-highlight) 15px,
                var(--pixel-bg) 15px,
                var(--pixel-bg) 30px
            );
        }

        /* 侧边栏像素风格 */
        .sidebar {
            width: 280px;
            background: linear-gradient(to bottom, var(--mario-blue), #2980b9);
            border-right: 6px solid var(--pixel-border);
            padding: 20px;
            position: relative;
        }

        .sidebar::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 100%;
            background: repeating-linear-gradient(
                180deg,
                var(--mario-yellow),
                var(--mario-yellow) 10px,
                transparent 10px,
                transparent 20px
            );
        }

        .quick-access h6 {
            color: var(--pixel-text);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px var(--pixel-border);
            border-bottom: 4px solid var(--pixel-border);
            padding-bottom: 8px;
            text-align: center;
            letter-spacing: 2px;
        }

        .nav-link {
            display: block;
            background: var(--mario-red);
            color: var(--pixel-text);
            padding: 12px 16px;
            border: 4px solid var(--pixel-border);
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.1s;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--pixel-border);
            cursor: pointer;
            position: relative;
            z-index: 10;
        }

        .nav-link:hover {
            background: #c0392b;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .sidebar {
            position: relative;
            z-index: 20;
        }

        .nav-link i {
            margin-right: 10px;
            text-shadow: 2px 2px 0px #000;
        }

        /* 工具栏像素风格 */
        .toolbar {
            background: linear-gradient(to right, var(--mario-green), #27ae60);
            border-bottom: 6px solid var(--pixel-border);
            padding: 12px 16px;
            gap: 12px;
            position: relative;
        }

        .toolbar::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--mario-yellow),
                var(--mario-yellow) 12px,
                transparent 12px,
                transparent 24px
            );
        }

        .btn {
            background: linear-gradient(to bottom, var(--mario-red), #c0392b);
            color: var(--pixel-text);
            border: 3px solid var(--pixel-border);
            border-radius: 0;
            padding: 8px 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #c0392b, #a5281e) !important;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
        }

        /* 操作按钮专用hover效果 */
        .btn-primary:hover { background: linear-gradient(to bottom, #2980b9, #1c6ea4) !important; }
        .btn-secondary:hover { background: linear-gradient(to bottom, #7f8c8d, #666666) !important; }
        .btn-success:hover { background: linear-gradient(to bottom, #27ae60, #219653) !important; }
        .btn-info:hover { background: linear-gradient(to bottom, #2980b9, #1f618d) !important; }
        .btn-warning:hover { background: linear-gradient(to bottom, #f39c12, #e67e22) !important; color: white !important; }
        .btn-light:hover {
            background: linear-gradient(to bottom, #f39c12, #e67e22) !important;
            color: var(--pixel-text) !important;
            border-color: var(--mario-red) !important;
        }

        .btn-light {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            color: var(--pixel-border);
        }

        .search-box, .path-input {
            background: var(--mario-yellow);
            color: var(--pixel-border);
            border: 4px solid var(--pixel-border);
            border-radius: 0;
            padding: 8px 16px;
            font-weight: bold;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3);
            font-family: 'Courier New', monospace;
        }

        .search-box:focus, .path-input:focus {
            outline: none;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.3), 0 0 0 0.25rem rgba(241, 196, 15, 0.25);
            border-color: var(--mario-red);
        }

        /* 文件列表像素风格 */
        .file-list {
            background: #0a1a2f;
            flex-grow: 1;
            overflow-y: auto;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 10px;
        }

        .file-item {
            display: grid;
            grid-template-columns: 40px 3fr 1fr 120px 120px 150px;
            align-items: center;
            padding: 12px 16px;
            border: 3px solid transparent;
            transition: all 0.1s;
            cursor: default;
            margin-bottom: 5px;
            background: rgba(0, 50, 100, 0.3);
        }

        .file-item:hover {
            border-color: var(--mario-yellow);
            background: rgba(251, 208, 0, 0.2);
            transform: translate(2px, 2px);
        }

        .file-item.text-muted {
            background: rgba(100, 100, 100, 0.5);
            color: #aaaaaa;
            border-bottom: 4px solid var(--pixel-border);
        }

        .file-item i {
            text-shadow: 2px 2px 0px var(--pixel-border);
        }

        /* 操作按钮组 */
        .btn-group .btn {
            margin-right: 5px;
        }

        .btn-primary {
            background: linear-gradient(to bottom, var(--mario-blue), #2980b9);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #95a5a6, #7f8c8d);
        }

        .btn-success {
            background: linear-gradient(to bottom, var(--mario-green), #27ae60);
        }

        .btn-info {
            background: linear-gradient(to bottom, #3498db, #2980b9);
        }

        .btn-warning {
            background: linear-gradient(to bottom, var(--mario-yellow), #f39c12);
            color: var(--pixel-border);
        }

        /* 状态栏像素风格 */
        .status-bar {
            background: linear-gradient(to right, var(--mario-red), #c0392b);
            border-top: 6px solid var(--pixel-border);
            padding: 12px 16px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            color: var(--pixel-text);
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--pixel-border);
        }

        .status-bar a {
            color: var(--mario-yellow);
            text-decoration: none;
        }

        .status-bar a:hover {
            color: white;
            text-decoration: underline;
        }

        /* 文件内容区域 */
        .file-content {
            display: none;
            background: #0a1a2f;
            padding: 20px;
            border-top: 6px solid var(--pixel-border);
            flex-grow: 1;
            overflow-y: auto;
            color: #00ff00;
            font-family: 'Courier New', monospace;
        }

        .alert {
            border: 4px solid var(--pixel-border);
            border-radius: 0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .alert-success {
            background: linear-gradient(to bottom, var(--mario-green), #27ae60);
            color: var(--pixel-text);
            border-color: var(--pixel-border);
        }

        .alert-danger {
            background: linear-gradient(to bottom, var(--mario-red), #c0392b);
            color: var(--pixel-text);
            border-color: var(--pixel-border);
        }

        pre {
            color: inherit;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', monospace;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 6px solid var(--pixel-border);
            }
            
            .d-flex {
                flex-direction: column;
            }
            
            .file-item {
                grid-template-columns: 40px 2fr 1fr 100px;
            }
        }

        /* 扫描线效果 */
        .scanline {
            position: relative;
            overflow: hidden;
        }

        .scanline::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(transparent 50%, rgba(0,255,0,0.1) 50%);
            background-size: 100% 6px;
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        /* Toast 动画 */
        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container-lg mt-4">
        <div class="file-explorer">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="quick-access">
                    <h6>🎮 快速访问</h6>
                    <div class="nav flex-column">
                        <a class="nav-link" href="#" data-path="C:\\">
                            <i class="fas fa-hdd me-2"></i>硬盘 C:
                        </a>
                        <a class="nav-link" href="#" data-path="D:\\">
                            <i class="fas fa-hdd me-2"></i>硬盘 D:
                        </a>
                        <a class="nav-link" href="#" data-path="E:\\">
                            <i class="fas fa-hdd me-2"></i>硬盘 E:
                        </a>
                        <a class="nav-link" href="#" data-path="C:\\ProgramData\\Qlik\\Sense\\Log\\Repository">
                            <i class="fas fa-book me-2"></i>Qlik存储库日志
                        </a>
                        <a class="nav-link" href="#" data-path="C:\\ProgramData\\Qlik\\Sense\\Log\\Script">
                            <i class="fas fa-scroll me-2"></i>Qlik脚本日志
                        </a>
                        <a class="nav-link" href="#" data-path="D:\\QlikShare\\ArchivedLogs">
                            <i class="fas fa-archive me-2"></i>Qlik归档日志
                        </a>
                        <a class="nav-link" href="#" data-path="D:\\DataShare">
                            <i class="fas fa-database me-2"></i>数据共享区
                        </a>
                        <a class="nav-link" href="#" data-path="C:\\Windows\\System32">
                            <i class="fas fa-cogs me-2"></i>系统文件
                        </a>
                        <a class="nav-link" href="#" data-path="C:\\Users">
                            <i class="fas fa-users me-2"></i>用户目录
                        </a>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="flex-grow-1 d-flex flex-column">
                <!-- 工具栏 -->
                <div class="toolbar d-flex flex-column">
                    <div class="d-flex align-items-center mb-3">
                        <div class="btn-group me-2">
                            <button class="btn btn-sm btn-light" id="btnBack" data-bs-toggle="tooltip" data-bs-placement="bottom" title="返回上一级目录">
                                <i class="fas fa-arrow-left"></i>
                            </button>
                            <button class="btn btn-sm btn-light" id="btnForward" data-bs-toggle="tooltip" data-bs-placement="bottom" title="前进到下一目录">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                        <button class="btn btn-sm btn-light me-2" id="btnUp" data-bs-toggle="tooltip" data-bs-placement="bottom" title="上级目录 (Parent Directory)">
                            <i class="fas fa-arrow-up"></i>
                        </button>
                        <button class="btn btn-sm btn-light me-2" id="btnClear" data-bs-toggle="tooltip" data-bs-placement="bottom" title="清除文件内容区域">
                            <i class="bi bi-journal-x"></i>
                        </button>
                        <div class="position-relative me-2">
                            <i class="fas fa-map-marker-alt" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--pixel-border); text-shadow: 1px 1px 0px white;"></i>
                            <input type="text" class="path-input mb-0 flex-grow-1 ps-4" placeholder="输入文件路径">
                        </div>
                        <!-- 上传按钮 -->
                        <button class="btn btn-sm btn-success me-2" id="btnUpload" data-bs-toggle="tooltip" data-bs-placement="bottom" title="上传文件到当前目录 (单文件上限100MB)">
                            <i class="fas fa-upload"></i>
                        </button>
                        <input type="file" id="fileInput" style="display:none;" multiple>
                        <div class="position-relative">
                            <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--pixel-border); text-shadow: 1px 1px 0px white;"></i>
                            <input type="text" class="search-box mb-0 flex-grow-1 ps-4" placeholder="搜索文件">
                        </div>
                    </div>
                </div>

                <!-- 文件列表 -->
                <div class="file-list" id="fileList">
                    <div class="file-item text-muted fw-bold">
                        <div></div>
                        <div>名称</div>
                        <div>类型</div>
                        <div>修改日期</div>
                        <div>大小</div>
                        <div>操作</div>
                    </div>
                </div>


                <!-- 状态栏 -->
                <div class="status-bar">
                    <span><i class="fas fa-coins"></i> 文件数量: <span id="fileCount">0</span></span>
                    <span>
                        <i class="fas fa-folder-open" title="进入文件夹"></i>
                        <i class="fas fa-book ms-2" title="日志查看器"></i>
                        <i class="fas fa-file-code ms-2" title="查看内容"></i>
                        <i class="fas fa-download ms-2" title="下载文件"></i>
                        <i class="fas fa-eye ms-2" title="文本查看器"></i>
                    </span>
                    <span>
                        <i class="fas fa-gamepad"></i>
                        <a href="https://github.com/moshowgame/windows-remote-admin" target="_blank">FileExplorer文件管理器</a>
                        <i class="fas fa-heart" style="color: var(--mario-red);"></i>
                        <a href="https://zhengkai.blog.csdn.net/" target="_blank">by Moshow</a>
                    </span>
                </div>
            </div>
        </div>
        <!-- 主内容区 -->
        <div class="flex-grow-1 d-flex flex-column">
            <!-- 文件内容 -->
            <div class="file-content" id="fileContent"></div>
        </div>
    </div>

    <script src="/static/jquery/3.7.1/jquery.min.js"></script>
    <script src="/static/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <script>
        const listUrl = '/list';
        const logViewerUrl = '/logmonitor';
        const vscodeUrl = '/texteditor';
        const readUrl = '/read';
        const downloadUrl = '/download';
        const normalizedPath = '/normalizedPath';
        // 图标映射
        const iconMap = {
            true: 'fa-folder',
            '文件夹': 'fa-folder',
            folder: 'fa-folder',
            'file-word': 'fa-file-word',
            'file-exe': 'fa-file-code',
            link: 'fa-link',
            default: 'fa-file'
        };

        let currentPath = 'C:\\';
        let history = [];
        let currentHistoryIndex = -1;
        // 新增文件系统对象以保存路径对应的文件列表
        const fileSystem = {};

        // 初始化
        $(document).ready(() => {
            console.log('文档加载完成');

            // 初始化所有 Bootstrap tooltips
            const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });

            loadPath(currentPath);

            // 快速访问点击 - 使用事件委托确保动态元素也能响应
            $(document).on('click', '.nav-link[data-path]', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('快速访问点击:', $(this).data('path'));
                console.log('点击元素:', this);
                loadPath($(this).data('path'));
            });

            // 调试：检查快速访问链接是否存在
            console.log('快速访问链接数量:', $('.nav-link[data-path]').length);
            $('.nav-link[data-path]').each(function(index) {
                console.log(`链接${index}:`, $(this).data('path'));
            });

            // 返回上级目录
            $('#btnUp').click(() => {
                const parentPath = getParentPath(currentPath);
                if (parentPath) loadPath(parentPath);
            });

            // 导航按钮
            $('#btnBack').click(() => navigateHistory(-1));
            $('#btnForward').click(() => navigateHistory(1));

            // 搜索功能
            $('.search-box').on('input', function() {
                const keyword = $(this).val().toLowerCase();
                filterFiles(keyword);
            });

            // 文件点击事件
            $('#fileList').on('click', '.file-item', function() {
                const fileName = $(this).find('div:nth-child(2)').text();
                const filePath = currentPath +"//"+ fileName;
                if ($(this).find('div:nth-child(1)').html() === '<i class="fas fa-folder text-primary"></i>') {
                    loadPath(filePath);
                } else {
                    readFile(filePath);
                }
                console.log($(this).find('div:nth-child(1)').html(),filePath);
            });

            // 进入文件夹
            $('#fileList').on('click', '.enter-btn', function(e) {
                e.stopPropagation();
                const path = $(this).data('path');
                loadPath(path);
            });

            // 读取文件
            $('#fileList').on('click', '.read-btn', function(e) {
                e.stopPropagation();
                const path = $(this).data('path');
                readFile(path);
            });

            // 下载文件
            $('#fileList').on('click', '.download-btn', function(e) {
                e.stopPropagation();
                const path = $(this).data('path');
                downloadFile(path);
            });

            // 查看文件
            $('#fileList').on('click', '.view-btn', function(e) {
                e.stopPropagation();
                const path = $(this).data('path');
                window.open(vscodeUrl+'?filePath=' + encodeURIComponent(path), '_blank');
            });

            // 打开日志查看器
            $('#fileList').on('click', '.log-viewer-btn', function(e) {
                e.stopPropagation();
                const path = $(this).data('path');
                window.open(logViewerUrl+'?filePath=' + encodeURIComponent(path), '_blank');
            });

            // 清除日志内容
            $('#btnClear').click(() => {
                $('#fileContent').empty().hide();
            });

            // 新增地址栏回车事件  
            $('.path-input').on('keydown', function(e) {  
                if (e.key === 'Enter') {  
                    const path = $(this).val().trim();  
                    if (path) {  
                        loadPath(path);  
                    }  
                }  
            });  
        });

        // 加载路径
        function loadPath(path, fromHistory = false) {
            if (!fromHistory) {
                history = history.slice(0, currentHistoryIndex + 1);
                history.push(path);
                currentHistoryIndex++;
            }

            currentPath = path;

            // 请求后端接口重新格式化路径
            $.ajax({
                url: '/normalizedPath',
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify({ filePath: path }),
                success: function(response) {
                    const normalizedPath = response.data;
                    currentPath = normalizedPath;
                    fetchFiles(normalizedPath);
                    updateNavigationButtons();
                    $('#fileContent').hide();
                    $('.path-input').val(normalizedPath);
                },
                error: function(xhr, status, error) {
                    console.error('路径格式化失败:', error);
                    fetchFiles(path);
                    updateNavigationButtons();
                    $('#fileContent').hide();
                    $('.path-input').val(path);
                }
            });
        }

        // 获取文件列表
        function fetchFiles(path) {
            $.ajax({
                url: listUrl,
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify({ filePath: path }),
                success: function(response) {
                    // 保存文件列表到 fileSystem 对象
                    fileSystem[path] = response.data;
                    renderFiles(response.data);
                },
                error: function(xhr, status, error) {
                    $('#fileList').empty().append('<div class="text-danger">加载文件失败: Access Denied Exception or other IO Exception</div>');
                }
            });
        }

        // 渲染文件列表
        function renderFiles(files) {
            const $list = $('#fileList').empty().append(
                '<div class="file-item text-muted fw-bold">' +
                '<div>名称</div><div>类型</div><div>修改日期</div><div>大小</div><div>操作</div></div>'
            );

            files.forEach(file => {
                const fileType = file.directory ? '文件夹' : '文件';
                const icon = iconMap[fileType] || iconMap.default;
                const actionButton = file.directory
                    ? `<button class="btn btn-sm btn-primary enter-btn" data-path="${currentPath}\\${file.name}" data-bs-toggle="tooltip" data-bs-placement="top" title="进入文件夹 (Enter)"><i class="bi bi-folder2-open"></i></button>
                       <button class="btn btn-sm btn-secondary log-viewer-btn" data-path="${currentPath}\\${file.name}" data-bs-toggle="tooltip" data-bs-placement="top" title="日志监控器 (Log Monitor)"><i class="bi bi-journal-text"></i></button>`
                    : `<button class="btn btn-sm btn-success read-btn" data-path="${currentPath}\\${file.name}" data-bs-toggle="tooltip" data-bs-placement="top" title="查看文件内容 (View Content)"><i class="fas fa-search"></i></button>
                       <button class="btn btn-sm btn-info download-btn" data-path="${currentPath}\\${file.name}" data-bs-toggle="tooltip" data-bs-placement="top" title="下载文件 (Download)"><i class="bi bi-file-earmark-arrow-down"></i></button>
                       <button class="btn btn-sm btn-warning view-btn" data-path="${currentPath}\\${file.name}" data-bs-toggle="tooltip" data-bs-placement="top" title="在文本编辑器中打开 (Open in Editor)"><i class="bi bi-window"></i></button>`;
                // 计算文件大小
                let fileSize = file.size;
                let sizeText;
                if(file.directory) {
                    sizeText='-'
                }else{
                    if (fileSize >= 1024 * 1024 * 1024) {
                        sizeText = (fileSize / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                    } else if (fileSize >= 1024 * 1024) {
                        sizeText = (fileSize / (1024 * 1024)).toFixed(2) + ' MB';
                    } else if (fileSize >= 1024) {
                        sizeText = (fileSize / 1024).toFixed(2) + ' KB';
                    } else {
                        sizeText = fileSize + ' B';
                    }
                }
                $list.append(`
                    <div class="file-item">
                        <div><i class="fas ${icon} text-primary"></i></div>
                        <div>${file.name}</div>
                        <div>${file.lastModified}</div>
                        <div>${sizeText}</div>
                        <div>${actionButton}</div>
                    </div>
                `);
            });

            // 更新状态栏
            $('#fileCount').text(files.length);
            $('.status-bar span:first').html(`<i class="fas fa-coins"></i> 文件数量: ${files.length}`);

            // 重新初始化动态添加的按钮 tooltips
            const tooltipTriggerList = [].slice.call(document.querySelectorAll('#fileList [data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        }

        // 搜索过滤
        function filterFiles(keyword) {
            // 从 fileSystem 对象中获取文件列表
            const files = fileSystem[currentPath] || [];
            const filtered = files.filter(file =>
                file.name.toLowerCase().includes(keyword)
            );
            renderFiles(filtered);
        }

        // 导航历史控制
        function navigateHistory(direction) {
            const newIndex = currentHistoryIndex + direction;
            if (newIndex >= 0 && newIndex < history.length) {
                currentHistoryIndex = newIndex;
                loadPath(history[currentHistoryIndex], true);
            }
        }

        // 获取上级路径
        function getParentPath(path) {
            const parts = path.split('\\').filter(p => p);
            if (parts.length <= 1) return null;
            return parts.slice(0, -1).join('\\') + '\\';
        }

        // 更新面包屑导航
        function updateBreadcrumb() {
            const parts = currentPath.split('\\').filter(p => p);
            const $breadcrumb = $('.breadcrumb').empty();

            parts.forEach((part, index) => {
                const isLast = index === parts.length - 1;
                const path = parts.slice(0, index + 1).join('\\') + '\\';
                $breadcrumb.append(
                    $(`<a class="breadcrumb-item ${isLast ? 'active' : ''}">${part}</a>`)
                        .click(!isLast ? () => loadPath(path) : null)
                );
            });
        }

        // 更新导航按钮状态
        function updateNavigationButtons() {
            $('#btnBack').prop('disabled', currentHistoryIndex <= 0);
            $('#btnForward').prop('disabled', currentHistoryIndex >= history.length - 1);
            $('#btnUp').prop('disabled', !getParentPath(currentPath));
        }

        // 读取文件内容
        function readFile(filePath) {
            $.ajax({
                url: readUrl,
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify({ filePath: filePath }),
                success: function(response) {
                    console.log(response);
                    $('#fileContent').html('<div class="alert alert-success" role="alert"><pre>' + response + '</pre></div>').show();
                },
                error: function(error) {
                    console.log(error);
                    $('#fileContent').html('<div class="alert alert-danger" role="alert"><i class="bi bi-bug-fill"></i><pre>'+error.responseJSON.code+' - '+error.responseJSON.msg+'</pre></div>').show();
                }
            });
        }
        // 下载文件内容
        function downloadFile(filePath) {
            $.ajax({
                url: downloadUrl,
                type: 'POST',
                contentType: 'application/json; charset=utf-8',
                data: JSON.stringify({ filePath: filePath }),
                success: function(response) {
                    // 创建一个隐藏的<a>标签，用于触发下载
                    const blob = new Blob([response], { type: 'application/octet-stream' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filePath.split('\\').pop(); // 使用文件名作为下载文件的默认名称
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    $('#fileContent').html('<div class="alert alert-success" role="alert"><i class="bi bi-cloud-arrow-down-fill"></i><pre>下载成功!!!</pre></div>').show();
                },
                error: function(error) {
                    console.log(error);
                    $('#fileContent').html('<div class="alert alert-danger" role="alert"><i class="bi bi-bug-fill"></i><pre>'+error.responseJSON.code+' - '+error.responseJSON.msg+'</pre></div>').show();
                }
            });
        }

        // 上传文件到当前目录
        const uploadUrl = '/upload';

        $('#btnUpload').click(() => {
            $('#fileInput').click();
        });

        $('#fileInput').on('change', function() {
            const files = this.files;
            if (files.length === 0) return;

        let uploadedCount = 0;
                let failedCount = 0;
                let replaceMsgs = [];

                Array.from(files).forEach(file => {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('targetPath', currentPath);

                    $.ajax({
                        url: uploadUrl,
                        type: 'POST',
                        data: formData,
                        processData: false,
                        contentType: false,
                        success: function(response) {
                            uploadedCount++;
                            if (response.data && response.data.replaced) {
                                replaceMsgs.push(file.name + ' (已替换)');
                            }
                            checkUploadComplete(files.length, uploadedCount, failedCount, replaceMsgs.join('\n'));
                        },
                    error: function(xhr) {
                        failedCount++;
                        const msg = xhr.responseJSON?.msg || '上传失败';
                        console.error('上传失败:', file.name, msg);
                        checkUploadComplete(files.length, uploadedCount, failedCount, msg + ': ' + file.name);
                    }
                });
            });

            // 清空 input 以便重复选择同一文件
            $(this).val('');
        });

        function checkUploadComplete(total, success, fail, extraMsg) {
            if (success + fail === total) {
                let msg = '';
                if (fail === 0) {
                    msg = `成功上传 ${success} 个文件`;
                    if (extraMsg) msg += '\n' + extraMsg;
                    $('#fileContent').html(`<div class="alert alert-success" role="alert"><i class="bi bi-cloud-upload-fill"></i><pre>${msg}</pre></div>`).show();
                } else {
                    msg = `上传完成: ${success} 成功, ${fail} 失败`;
                    if (extraMsg) msg += '\n' + extraMsg;
                    if (errorMsg !== undefined) msg += '\n' + errorMsg;
                    $('#fileContent').html(`<div class="alert alert-danger" role="alert"><i class="bi bi-bug-fill"></i><pre>${msg}</pre></div>`).show();
                }
                loadPath(currentPath); // 刷新当前目录列表
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文本编辑器</title>

    <!-- Bootstrap 5 CSS -->
    <link href="/static/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/static/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/static/bootstrap/5.3.2/css/bootstrap-icons.min.css">

    <style>
        /* 马里奥像素风格主题 */
        :root {
            --mario-red: #e52521;
            --mario-blue: #3c44aa;
            --mario-green: #4bad4b;
            --mario-yellow: #fbd000;
            --mario-brown: #964b00;
            --mario-skin: #fcb97d;
            --pixel-bg: #6b8cff;
            --pixel-border: #000000;
            --pixel-highlight: #ff0000;
            --pixel-text: #ffffff;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            padding: 20px 0;
            overflow-x: hidden;
            margin: 0;
            position: relative;
        }

        /* 背景装饰元素 */
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .mario-block {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--mario-red);
            border: 4px solid var(--pixel-border);
            z-index: 1;
        }

        .mario-block.question {
            background: var(--mario-yellow);
            color: var(--pixel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
        }

        .coin {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--mario-yellow);
            border: 2px solid var(--pixel-border);
            border-radius: 50%;
            animation: coinFloat 3s ease-in-out infinite;
        }

        @keyframes coinFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .pipe {
            position: absolute;
            width: 60px;
            background: var(--mario-green);
            border: 4px solid var(--pixel-border);
        }

        .pipe-top {
            height: 30px;
            border-bottom: none;
            border-radius: 30px 30px 0 0;
        }

        .pipe-stem {
            height: 80px;
            border-top: none;
        }

        .cloud {
            position: absolute;
            background: white;
            border: 3px solid var(--pixel-border);
            border-radius: 50%;
        }

        .cloud:before, .cloud:after {
            content: "";
            position: absolute;
            background: white;
            border: 3px solid var(--pixel-border);
            border-radius: 50%;
        }

        /* 导航栏像素风格 */
        .navbar-mario {
            background: linear-gradient(to right, var(--mario-red), #c0392b) !important;
            border: 4px solid var(--pixel-border);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            position: relative;
        }

        .navbar-mario::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--mario-yellow),
                var(--mario-yellow) 15px,
                var(--mario-red) 15px,
                var(--mario-red) 30px
            );
        }

        .navbar-brand {
            font-weight: bold;
            text-shadow: 3px 3px 0px var(--pixel-border);
            letter-spacing: 2px;
            color: var(--pixel-text) !important;
        }

        /* 卡片像素风格 */
        .card-mario {
            background: var(--pixel-bg);
            border: 6px solid var(--pixel-border);
            box-shadow: 12px 12px 0px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .card-mario::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--pixel-highlight),
                var(--pixel-highlight) 15px,
                var(--pixel-bg) 15px,
                var(--pixel-bg) 30px
            );
        }

        .card-header-mario {
            background: linear-gradient(to right, var(--mario-blue), #2980b9);
            color: var(--pixel-text);
            border: 4px solid var(--pixel-border);
            font-weight: bold;
            text-shadow: 2px 2px 0px var(--pixel-border);
            letter-spacing: 1px;
            position: relative;
        }

        /* 表单元素像素风格 */
        .form-control-mario {
            background: white;
            border: 4px solid var(--pixel-border);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 10px;
        }

        .form-control-mario:focus {
            outline: none;
            box-shadow: 0 0 0 0.25rem rgba(60, 68, 170, 0.25);
            border-color: var(--mario-blue);
        }

        .btn-mario {
            background: linear-gradient(to bottom, var(--mario-green), #27ae60);
            color: var(--pixel-text);
            border: 4px solid var(--pixel-border);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
            transition: all 0.1s;
            text-shadow: 2px 2px 0px var(--pixel-border);
        }

        .btn-mario:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #27ae60, #219653);
        }

        .btn-mario:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
        }

        /* Ace Editor 自定义样式 */
        #logEditor {
            border: 4px solid var(--pixel-border) !important;
            border-radius: 0 !important;
        }

        /* 搜索高亮样式 */
        .ace_highlight-marker {
            background-color: var(--mario-yellow) !important;
            color: var(--pixel-border) !important;
            font-weight: bold !important;
        }
        
        /* 搜索匹配项高亮 */
        .ace_marker-layer .ace_selected-word {
            background-color: rgba(251, 208, 0, 0.7) !important;
            border: 2px solid var(--mario-red) !important;
            border-radius: 2px;
        }
        
        .ace_marker-layer .ace_selection {
            background-color: rgba(251, 208, 0, 0.5) !important;
        }
        
        /* 当前行高亮 */
        .ace_marker-layer .ace_active-line {
            background-color: rgba(60, 68, 170, 0.1) !important;
        }

        /* 底部信息 */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            color: var(--mario-brown);
            font-size: 0.9rem;
            text-shadow: 1px 1px 0px white;
        }

        .footer-info a {
            color: var(--mario-blue);
            text-decoration: none;
            font-weight: bold;
        }

        .footer-info a:hover {
            color: var(--mario-red);
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 10px;
            }
            
            #logEditor {
                height: calc(100vh - 200px) !important;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰元素 -->
    <div class="background-elements">
        <!-- 云朵 -->
        <div class="cloud" style="top: 50px; left: 100px; width: 80px; height: 40px;"></div>
        <div class="cloud" style="top: 120px; right: 150px; width: 100px; height: 50px;"></div>
        
        <!-- 管道 -->
        <div class="pipe pipe-top" style="bottom: 50px; right: 100px; width: 60px;"></div>
        <div class="pipe pipe-stem" style="bottom: 50px; right: 100px; width: 60px;"></div>
        
        <!-- 金币 -->
        <div class="coin" style="top: 80px; right: 300px;"></div>
        <div class="coin" style="top: 150px; left: 250px;"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar navbar-dark navbar-mario">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fas fa-file-alt"></i> 文本编辑器
            </span>
            <div class="d-flex">
                <div class="form-check form-switch text-light me-3">
                    <i class="fas fa-heart" style="color: var(--mario-red);"></i>
                    Powered by Moshow | 
                    <a href="https://zhengkai.blog.csdn.net/" target="_blank">
                        <i class="fab fa-blogger"></i> CSDN
                    </a> | 
                    <a href="https://github.com/moshowgame/windows-remote-admin" target="_blank">
                        <i class="fab fa-github"></i> GitHub
                    </a>
                    <i class="fas fa-heart" style="color: var(--mario-red);"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row mt-3">
            <!-- 主编辑器区域 -->
            <div class="col-12">
                <div class="card card-mario">
                    <div class="card-header card-header-mario">
                        <i class="fas fa-file"></i> 文件内容查看
                        <button type="button" id="refreshBtn" class="btn btn-mario btn-sm float-end">
                            <i class="fas fa-sync-alt"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body p-3">
                        <!-- 文件信息 -->
                        <div class="alert alert-info mb-3">
                            <i class="fas fa-info-circle"></i>
                            <strong>当前文件:</strong> <span id="fileName"></span>
                        </div>
                        
                        <!-- 搜索功能 -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">内容搜索 (实时高亮)</label>
                            <div class="input-group">
                                <input type="text" id="searchInput" class="form-control form-control-mario" placeholder="输入关键词进行搜索和高亮...">
                                <button class="btn btn-mario" type="button" id="clearSearch">
                                    <i class="fas fa-times"></i> 清除
                                </button>
                            </div>
                        </div>
                        
                        <!-- 编辑器区域 -->
                        <div id="logEditor" style="height: calc(100vh - 300px); width: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <div class="footer-info">
        <i class="fas fa-mario" style="color: var(--mario-red);"></i>
        Windows Remote Admin - 专为Windows远程管理而生
        <i class="fas fa-mario" style="color: var(--mario-red);"></i>
    </div>

    <!-- 脚本依赖 -->
    <script src="/static/jquery/3.7.1/jquery.min.js"></script>
    <script src="/static/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Ace JS -->
    <script src="/static/ace/1.37.2/ace.min.js"></script>
    <script src="/static/ace/1.37.2/ext-themelist.min.js"></script>
    <script src="/static/ace/1.37.2/mode-logtalk.min.js"></script>

    <script>
        // 加载文件列表
        $(function() {
            const listUrl = '/list';
            const readUrl = '/read';
            const downloadUrl = '/download';
            const filePath = '{{.filePath}}';
            const parentPath = filePath.substring(0, filePath.lastIndexOf('\\'));
            const fileNameStr = filePath.substring(filePath.lastIndexOf('\\')+1,filePath.length);
            
            $('#fileName').html(`<i class="fas fa-folder"></i> ${filePath}`);
            
            let editor = ace.edit("logEditor");
            editor.setTheme("ace/theme/clouds"); // 使用明亮主题配合马里奥风格
            editor.session.setMode("ace/mode/text"); // 使用文本模式
            editor.setReadOnly(true);
            editor.setOption("wrapBehavioursEnabled", true);
            editor.setOption("wrapMode", true);
            editor.setOption("scrollPastEnd", 0.1);
            editor.setShowPrintMargin(false); // 隐藏打印边距线
            
            // 启用搜索功能
            editor.setOption("highlightActiveLine", true);
            editor.setOption("highlightSelectedWord", true);
            // 不要手动设置$search，让Ace Editor自己处理
            
            // 设置编辑器样式
            document.getElementById('logEditor').style.border = '4px solid #000000';
            
            // 安全的setValue包装函数
            function safeSetValue(cm, value) {
                try {
                    const content = value || '';
                    cm.setValue(typeof content === 'string' ? content : String(content));
                    cm.renderer.updateFull(true); // 强制刷新
                    cm.resize(true); // 重新计算大小
                } catch (e) {
                    console.error('Error setting editor value:', e);
                    cm.setValue('⚠️ 内容加载出现错误');
                    cm.renderer.updateFull(true);
                }
            }

            // 调用 /read 接口读取文件内容
            $.ajax({
                url: readUrl,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ filePath: filePath }),
                beforeSend: function() {
                    safeSetValue(editor, '🎮 正在加载文件内容，请稍候...');
                },
                success: function(response) {
                    // 处理不同的响应格式
                    let fileContent = '';
                    if (typeof response === 'string') {
                        // 直接返回字符串格式
                        fileContent = response;
                    } else if (response && response.data) {
                        // ResponseUtil.success()包装格式
                        fileContent = response.data;
                    } else {
                        fileContent = '⚠️ 无法解析文件内容';
                    }
                    
                    safeSetValue(editor, fileContent);
                    editor.scrollToLine(0);
                    editor.clearSelection();
                    
                    // 如果是日志文件，应用基本的语法高亮
                    if (filePath.toLowerCase().endsWith('.log') || filePath.toLowerCase().endsWith('.txt')) {
                        applyLogHighlighting(fileContent);
                    }
                },
                error: function(error) {
                    console.error('Error reading file:', error);
                    const errorMessage = "❌ 文件读取失败: " + (error.responseJSON?.msg || error.statusText || '未知错误');
                    safeSetValue(editor, errorMessage);
                }
            });

            // 搜索功能
            $('#searchInput').on('input', function() {
                const query = $(this).val().trim();
                
                // 清除之前的搜索结果
                try {
                    editor.findAll('', {
                        backwards: false,
                        wrap: true,
                        caseSensitive: false,
                        wholeWord: false,
                        regExp: false,
                        highlightAll: false
                    });
                } catch (e) {
                    // 如果findAll失败，使用clearSelection作为备选方案
                    editor.clearSelection();
                }
                
                if (query) {
                    // 执行新的搜索
                    try {
                        const options = {
                            backwards: false,
                            wrap: true,
                            caseSensitive: false,
                            wholeWord: false,
                            regExp: false,
                            highlightAll: true
                        };
                        
                        const found = editor.find(query, options);
                        
                        // 如果找到匹配项，滚动到第一个匹配位置
                        if (found) {
                            const cursor = editor.getCursorPosition();
                            editor.scrollToLine(cursor.row, true, true, function() {});
                        }
                    } catch (e) {
                        console.error('Search error:', e);
                    }
                }
            });

            // 清除搜索
            $('#clearSearch').click(function() {
                $('#searchInput').val('');
                editor.clearSelection();
                try {
                    editor.findAll('', {
                        backwards: false,
                        wrap: true,
                        caseSensitive: false,
                        wholeWord: false,
                        regExp: false,
                        highlightAll: false
                    }); // 清除所有高亮
                } catch (e) {
                    // 备选方案
                    editor.clearSelection();
                }
                editor.focus();
            });

            // 刷新按钮
            $('#refreshBtn').click(function() {
                location.reload();
            });

            // 为日志文件应用基本高亮
            function applyLogHighlighting(content) {
                // 简单的日志级别高亮
                const lines = content.split('\n');
                const highlightedLines = lines.map(line => {
                    if (line.includes('ERROR') || line.includes('FATAL')) {
                        return `<span style="color: #e52521; font-weight: bold;">${line}</span>`;
                    } else if (line.includes('WARN') || line.includes('WARNING')) {
                        return `<span style="color: #fbd000; font-weight: bold;">${line}</span>`;
                    } else if (line.includes('INFO')) {
                        return `<span style="color: #3c44aa;">${line}</span>`;
                    } else if (line.includes('DEBUG')) {
                        return `<span style="color: #964b00;">${line}</span>`;
                    }
                    return line;
                });
                
                // 注意：Ace Editor 不直接支持 HTML，这里只是示意
                // 实际应用中可以使用 Ace 的标记功能或者自定义高亮规则
            }

            // 键盘快捷键
            $(document).keydown(function(e) {
                // Ctrl+F 聚焦搜索框
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    $('#searchInput').focus();
                    $('#searchInput').select();
                }
                // ESC 清除搜索
                if (e.key === 'Escape') {
                    $('#clearSearch').click();
                }
                // Enter键在搜索框中查找下一个匹配项
                if (e.key === 'Enter' && document.activeElement.id === 'searchInput') {
                    e.preventDefault();
                    const query = $('#searchInput').val().trim();
                    if (query) {
                        editor.findNext();
                        const cursor = editor.getCursorPosition();
                        editor.scrollToLine(cursor.row, true, true, function() {});
                    }
                }
            });
            
            // 搜索框获得焦点时的处理
            $('#searchInput').focus(function() {
                $(this).select(); // 自动选中所有文本
            });
            
            // 搜索框失去焦点时清除选中
            $('#searchInput').blur(function() {
                // 可以在这里添加失去焦点时的处理逻辑
            });
        });
    </script>
</body>
</html>
